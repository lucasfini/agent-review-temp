name: Temporary codebase inventory

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package tracked files for audit
        shell: bash
        run: git ls-files -z | tar --null -czf repo-snapshot.tar.gz --files-from=-

      - name: Upload codebase snapshot
        uses: actions/upload-artifact@v4
        with:
          name: codebase-snapshot
          path: repo-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
