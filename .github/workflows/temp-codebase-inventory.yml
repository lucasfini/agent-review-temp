name: Temporary codebase audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package tracked files for audit
        shell: bash
        run: git ls-files -z | tar --null -czf repo-snapshot.tar.gz --files-from=-

      - name: Upload codebase snapshot
        uses: actions/upload-artifact@v4
        with:
          name: codebase-snapshot
          path: repo-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: audit-placeholder
      SUPABASE_SERVICE_ROLE_KEY: audit-placeholder
      OPENAI_API_KEY: audit-placeholder
      ASSEMBLYAI_API_KEY: audit-placeholder
      DEEPGRAM_API_KEY: audit-placeholder
      R2_ACCOUNT_ID: audit-placeholder
      R2_ACCESS_KEY_ID: audit-placeholder
      R2_SECRET_ACCESS_KEY: audit-placeholder
      R2_BUCKET_NAME: audit-placeholder
      STRIPE_SECRET_KEY: sk_test_audit_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_audit_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_audit_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      INTERNAL_JOB_TOKEN: audit-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint > audit-lint.log 2>&1

      - name: Test
        id: test
        continue-on-error: true
        run: npm test -- --runInBand > audit-test.log 2>&1

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build > audit-build.log 2>&1

      - name: Record verification status
        if: always()
        shell: bash
        run: |
          {
            echo "lint=${{ steps.lint.outcome }}"
            echo "test=${{ steps.test.outcome }}"
            echo "build=${{ steps.build.outcome }}"
          } > audit-status.txt

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codebase-verification
          path: |
            audit-status.txt
            audit-lint.log
            audit-test.log
            audit-build.log
          if-no-files-found: warn
          retention-days: 1

      - name: Fail when repository verification failed
        if: always() && (steps.lint.outcome != 'success' || steps.test.outcome != 'success' || steps.build.outcome != 'success')
        run: exit 1
